<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://grc.iit.edu/center/team">
<meta http-equiv="refresh" content="0; url=/center/team">
<title>Page moved</title>
</head>
<body>
<p>This page has moved. <a href="/center/team">Continue to the current page</a>.</p>
<script>
const destination = new URL("/center/team", window.location.origin);
const aliases = {"research-staff": "technical-staff", "external-collaborators": "collaborators", "some-of-our-alumni": "alumni"};
if (destination.origin === window.location.origin) {
  destination.search = window.location.search;
  const incoming = decodeURIComponent(window.location.hash.slice(1));
  if (aliases[incoming]) destination.hash = aliases[incoming];
  else if (!destination.hash) destination.hash = window.location.hash;
}
window.location.replace(destination.href);
</script>
</body>
</html>
